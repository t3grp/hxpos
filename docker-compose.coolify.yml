# Coolify Git Compose application. Pin git_commit_sha in Coolify before deploying.
# Configure app:8000 and frontend:3000 as the only public services.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DEBUG: "false"
  PROJECT_NAME: HiddenXP OS
  TIMEZONE: Asia/Singapore
  SECRET_KEY: ${SECRET_KEY:?required}
  API_KEY: ${API_KEY:?required}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?required}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: hiddenxpos
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  FRONTEND_URL: ${PUBLIC_SITE_URL:?required}
  PUBLIC_BASE_URL: ${PUBLIC_API_URL:?required}
  CORS_ORIGINS: ${CORS_ORIGINS:?required}
  RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
  DIAGNOSTICS_ENABLED: "false"
  LOGFIRE_CONSOLE: "false"
  WORKER_INGEST_CHILDREN: "1"

x-backend: &backend
  image: hxpos-backend:${HIDDENXPOS_SOURCE_SHA:?required}
  pull_policy: build
  build:
    context: .
    dockerfile: backend/Dockerfile
    labels:
      org.opencontainers.image.source: https://github.com/t3grp/hxpos
      org.opencontainers.image.revision: ${HIDDENXPOS_SOURCE_SHA:?required}
  environment: *backend-environment
  logging: *logging
  networks: [data, edge]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hiddenxpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: >-
      postgres -c max_connections=200 -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=512MB -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB -c work_mem=8MB
    shm_size: 512mb
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d hiddenxpos]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g

  redis:
    image: valkey/valkey:8-alpine
    command: >-
      valkey-server --requirepass ${REDIS_PASSWORD:?required}
      --maxmemory 384mb --maxmemory-policy allkeys-lru --save ''
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    networks: [data]
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  migrate:
    <<: *backend
    command: agenticos db upgrade
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    mem_limit: 1536m

  bootstrap:
    <<: *backend
    command:
      - sh
      - -c
      - exec agenticos cmd bootstrap --org HiddenXP --email "$$BOOTSTRAP_EMAIL" --password "$$BOOTSTRAP_PASSWORD"
    environment:
      <<: *backend-environment
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?required}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?required}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: "no"
    mem_limit: 1536m

  app:
    <<: *backend
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --timeout-worker-healthcheck 60 --ws websockets-sansio
    expose: ["8000"]
    volumes: [media_data:/app/media]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 1536m

  worker:
    <<: *backend
    command: python -m app.worker
    volumes: [media_data:/app/media]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/agenticos-worker-alive').st_mtime < 90"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 2g

  frontend:
    image: hxpos-frontend:${HIDDENXPOS_SOURCE_SHA:?required}
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.source: https://github.com/t3grp/hxpos
        org.opencontainers.image.revision: ${HIDDENXPOS_SOURCE_SHA:?required}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://app:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:?required}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:?required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?required}
      OAUTH_PROVIDERS: ""
      DIAGNOSTICS_ENABLED: "false"
    expose: ["3000"]
    networks: [edge]
    logging: *logging
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    mem_limit: 768m

networks:
  data:
    internal: true
  edge:

volumes:
  postgres_data:
  media_data:
